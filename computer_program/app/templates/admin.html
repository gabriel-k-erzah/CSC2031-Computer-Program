{% extends "base.html" %}
{% block title %}Admin{% endblock %}

{% block content %}
<h1>Admin</h1>

<div class="mb-3">
  <form method="POST" action="{{ url_for('main.logout') }}">
    {{ csrf_token() }}
    <button type="submit" class="btn btn-outline-danger btn-sm">
      Logout
    </button>
  </form>
</div>

<p>Welcome Admin! You have full system access.</p>
{% endblock %}
